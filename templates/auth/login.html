{# ==========================================================================
   templates/auth/login.html — the sign-in screen.

   Owner: hina (front end). Renders into base.html, which supplies the shared
   chrome and the two `<script type="application/json">` data blocks.

   Context (src/api/pages.py::login):
     next     str  where to go after a successful sign-in, already validated
     error    str  a failure message from the POST body, or None
     switch   bool the user asked to switch account rather than be redirected on

   The form posts to the JSON session endpoint and is progressively enhanced by
   static/js/login.js: without JavaScript it is a normal form that posts to
   /api/auth/session and the browser follows the redirect; with JavaScript the
   failure is shown inline without a page reload. Either path works — the page
   is not dependent on the client runtime.
   ========================================================================== #}
{% extends "base.html" %}
{% import "_macros.html" as ui %}

{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block page_id %}login{% endblock %}

{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card" data-testid="login-card">
    <div class="auth-card__brand">
      <img class="auth-card__logo" src="{{ url_for('static', filename='img/logo.svg') }}"
           alt="" width="36" height="36" aria-hidden="true">
      <div>
        <h1 class="auth-card__title">{{ app_name }}</h1>
        <p class="auth-card__sub">AcousticX Intelligence · dual-model sound event detection</p>
      </div>
    </div>

    {% if switch %}
      <p class="callout">You are signed in. Sign in as someone else to see the console from
        another role, or use the sign-out button in the header first.</p>
    {% endif %}

    {% if error %}
      <div class="banner banner--error" role="alert" data-testid="login-error">
        <span class="banner__icon" aria-hidden="true">{{ ui.icon('warn', 20) }}</span>
        <div class="banner__body">
          <p class="banner__text">{{ error }}</p>
        </div>
      </div>
    {% endif %}

    <form class="auth-form stack" method="post" action="{{ url_for('auth.session') }}"
          data-login-form novalidate>
      {{ csrf_token() if csrf_token is defined }}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field">
        <label class="field__label" for="username">Username</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="off" required
               aria-describedby="username-hint"
               {% if error %}aria-invalid="true"{% endif %}>
        <p class="field__hint" id="username-hint">The account your role was created under.</p>
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" required
               aria-describedby="password-hint"
               {% if error %}aria-invalid="true"{% endif %}>
        <p class="field__hint" id="password-hint">Access is granted per capability, not per role
          name — what you can open is decided after you sign in.</p>
      </div>

      <div class="row row--between">
        <label class="checkline" for="remember">
          <input type="checkbox" id="remember" name="remember" value="1">
          <span>Keep me signed in on this device</span>
        </label>
        <button class="btn btn--primary" type="submit" data-login-submit>
          {{ ui.icon('logout', 16) }} <span>Sign in</span>
        </button>
      </div>
    </form>

    <hr>

    <p class="field__hint">
      Predictions on this console come from two independently trained models — the project's
      own Python model and a Google Teachable Machine model — and every result shows both,
      side by side, with the difference between them. Neither model sees the other's output.
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
{% endblock %}
